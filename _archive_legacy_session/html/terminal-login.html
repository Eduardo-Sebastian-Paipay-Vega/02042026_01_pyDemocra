<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html {
        visibility: hidden;
        background: #020202;
      }

      html.loaded {
        visibility: visible;
      }
    </style>
    <noscript><style>html { visibility: visible !important; }</style></noscript>
    <title>Solaris | Terminal Login</title>
    <meta name="description" content="Acceso terminal con PIN y bloqueo adaptativo." />
    <link rel="icon" href="./Imagen/Iconos/logo_cua1.png" type="image/png" />
    <link rel="preload" href="/src/styles/theme.css" as="style" />
    <link rel="preload" href="/src/styles/auth.css" as="style" />
    <link rel="stylesheet" href="/src/styles/theme.css" />
    <link rel="stylesheet" href="/src/styles/auth.css" />
  </head>
  <body class="auth-page page-auth page-terminal-login has-fixed-header">
    <header class="header">
      <div class="container header-inner">
        <a class="brand" href="/index.html" aria-label="Solaris Home">
          <img
            src="/assets/logo-solaris.svg"
            alt="Logo Solaris"
            class="brand-logo-img"
            onerror="this.onerror=null;this.src='./Imagen/Iconos/logo_cua1.png';"
          />
          <span>SOLARIS</span>
        </a>
      </div>
    </header>

    <main class="auth-shell">
      <section class="auth-card" aria-label="Ingreso terminal">
        <div class="auth-brand">
          <img
            src="/assets/logo-solaris.svg"
            alt="Solaris"
            class="auth-brand__logo"
            onerror="this.onerror=null;this.src='./Imagen/Iconos/logo_blanco_1.png';"
          />
          <h1 class="auth-brand__title">Terminal PIN</h1>
        </div>

        <form class="auth-form" data-auth-form="terminal-login" novalidate>
          <div>
            <label class="auth-label" for="terminal-tenant">Tenant ID</label>
            <input class="auth-input" id="terminal-tenant" name="tenant_id" type="text" required />
          </div>

          <div>
            <label class="auth-label" for="terminal-user">User ID</label>
            <input class="auth-input" id="terminal-user" name="user_id" type="text" required />
          </div>

          <div>
            <label class="auth-label" for="terminal-id">Terminal ID</label>
            <input class="auth-input" id="terminal-id" name="terminal_id" type="text" required />
          </div>

          <div>
            <label class="auth-label" for="terminal-fp">Device fingerprint</label>
            <input class="auth-input" id="terminal-fp" name="device_fingerprint" type="text" required />
          </div>

          <div>
            <label class="auth-label" for="terminal-pin">PIN</label>
            <input
              class="auth-input"
              id="terminal-pin"
              name="pin"
              type="password"
              inputmode="numeric"
              minlength="4"
              maxlength="8"
              required
            />
          </div>

          <button class="auth-submit" type="submit">Validar PIN</button>
          <p class="auth-feedback" data-auth-feedback aria-live="polite"></p>
        </form>

        <div class="auth-links">
          <a class="auth-link" href="/login.html">Volver a login web</a>
        </div>
      </section>
    </main>

    <script>
      window.addEventListener("load", function () {
        document.documentElement.classList.add("loaded");
      });
    </script>
    <script type="module" src="/src/js/auth.js"></script>
  </body>
</html>
