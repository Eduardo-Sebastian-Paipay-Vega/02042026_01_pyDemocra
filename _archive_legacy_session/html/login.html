<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html {
        visibility: hidden;
        background: #020202;
      }

      html.loaded {
        visibility: visible;
      }
    </style>
    <noscript><style>html { visibility: visible !important; }</style></noscript>
    <title>Solaris | Login Seguro</title>
    <meta name="description" content="Ingresa con control de riesgo adaptativo." />
    <link rel="icon" href="./Imagen/Iconos/logo_cua1.png" type="image/png" />
    <link rel="preload" href="/src/styles/theme.css" as="style" />
    <link rel="preload" href="/src/styles/auth.css" as="style" />
    <link rel="stylesheet" href="/src/styles/theme.css" />
    <link rel="stylesheet" href="/src/styles/auth.css" />
  </head>
  <body class="auth-page page-auth page-login has-fixed-header">
    <header class="header">
      <div class="container header-inner">
        <a class="brand" href="/index.html" aria-label="Solaris Home">
          <img
            src="/assets/logo-solaris.svg"
            alt="Logo Solaris"
            class="brand-logo-img"
            onerror="this.onerror=null;this.src='./Imagen/Iconos/logo_cua1.png';"
          />
          <span>SOLARIS</span>
        </a>

        <nav class="nav" aria-label="Navegacion principal">
          <a class="nav-link" href="/index.html#enfoque">Enfoque</a>
          <a class="nav-link" href="/studio.html">Archivo</a>
          <a class="nav-link" href="/nosotros.html">Nosotros</a>
          <div class="nav-login" aria-label="Login">
            <span class="nav-login__label">Login</span>
            <a class="nav-login__link is-active" href="/login.html">Ingresar</a>
            <a class="nav-login__link" href="/register.html">Registrarse</a>
          </div>
        </nav>

        <div class="mobile-simple-menu" aria-label="Menu de acceso">
          <span class="mobile-simple-menu__label">Login</span>
          <a class="mobile-simple-menu__link is-active" href="/login.html">Ingresar</a>
          <a class="mobile-simple-menu__link" href="/register.html">Registrarse</a>
        </div>
      </div>
    </header>

    <main class="auth-shell">
      <section class="auth-card" aria-label="Formulario de ingreso">
        <div class="auth-brand">
          <img
            src="/assets/logo-solaris.svg"
            alt="Solaris"
            class="auth-brand__logo"
            onerror="this.onerror=null;this.src='./Imagen/Iconos/logo_blanco_1.png';"
          />
          <h1 class="auth-brand__title">Solaris</h1>
        </div>

        <form class="auth-form" data-auth-form="login" novalidate>
          <div>
            <label class="auth-label" for="login-email">Correo</label>
            <input
              class="auth-input"
              id="login-email"
              name="email"
              type="email"
              autocomplete="username"
              required
            />
          </div>

          <div>
            <label class="auth-label" for="login-password">Contrasena</label>
            <div class="auth-password-wrap">
              <input
                class="auth-input"
                id="login-password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
              />
              <button
                class="auth-password-toggle"
                type="button"
                data-toggle-password="login-password"
                aria-label="Mostrar contrasena"
                aria-pressed="false"
              >
                <svg
                  class="auth-password-icon auth-password-icon--show"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg
                  class="auth-password-icon auth-password-icon--hide"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  hidden
                >
                  <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19C5 19 1 12 1 12a21.76 21.76 0 0 1 5.06-6.94"></path>
                  <path d="M9.9 4.24A10.93 10.93 0 0 1 12 5c7 0 11 7 11 7a22.48 22.48 0 0 1-2.17 3.19"></path>
                  <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <button class="auth-submit" type="submit">Ingresar</button>
          <p class="auth-feedback" data-auth-feedback aria-live="polite"></p>
        </form>

        <div class="auth-links">
          <a class="auth-link" href="/register.html">Crear cuenta</a>
          <a class="auth-link" href="/onboarding.html">Continuar onboarding</a>
        </div>
      </section>
    </main>

    <script>
      window.addEventListener("load", function () {
        document.documentElement.classList.add("loaded");
      });
    </script>
    <script type="module" src="/src/js/auth.js"></script>
  </body>
</html>
