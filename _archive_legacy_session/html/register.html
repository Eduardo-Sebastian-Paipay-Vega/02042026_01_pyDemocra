<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html {
        visibility: hidden;
        background: #020202;
      }

      html.loaded {
        visibility: visible;
      }
    </style>
    <noscript><style>html { visibility: visible !important; }</style></noscript>
    <title>Solaris | Crear Cuenta</title>
    <meta name="description" content="Crea tu cuenta para iniciar onboarding en Solaris." />
    <link rel="icon" href="./Imagen/Iconos/logo_cua1.png" type="image/png" />
    <link rel="preload" href="/src/styles/theme.css" as="style" />
    <link rel="preload" href="/src/styles/auth.css" as="style" />
    <link rel="stylesheet" href="/src/styles/theme.css" />
    <link rel="stylesheet" href="/src/styles/auth.css" />
  </head>
  <body class="auth-page page-auth page-register has-fixed-header">
    <header class="header">
      <div class="container header-inner">
        <a class="brand" href="/index.html" aria-label="Solaris Home">
          <img
            src="/assets/logo-solaris.svg"
            alt="Logo Solaris"
            class="brand-logo-img"
            onerror="this.onerror=null;this.src='./Imagen/Iconos/logo_cua1.png';"
          />
          <span>SOLARIS</span>
        </a>

        <nav class="nav" aria-label="Navegacion principal">
          <a class="nav-link" href="/index.html#enfoque">Enfoque</a>
          <a class="nav-link" href="/studio.html">Archivo</a>
          <a class="nav-link" href="/nosotros.html">Nosotros</a>
          <div class="nav-login" aria-label="Acceso">
            <span class="nav-login__label">Acceso</span>
            <a class="nav-login__link" href="/login.html">Ingresar</a>
            <a class="nav-login__link is-active" href="/register.html">Crear cuenta</a>
          </div>
        </nav>
      </div>
    </header>

    <main class="auth-shell">
      <section class="auth-card auth-card--wide" aria-label="Registro de cuenta">
        <div class="auth-brand">
          <img
            src="/assets/logo-solaris.svg"
            alt="Solaris"
            class="auth-brand__logo"
            onerror="this.onerror=null;this.src='./Imagen/Iconos/logo_cobre.png';"
          />
          <h1 class="auth-brand__title">Crear Cuenta</h1>
        </div>

        <p class="auth-helper">
          Paso 1 de 2: crea tu cuenta con email y contrasena. Luego pasaras al onboarding visual.
        </p>

        <form class="auth-form" data-register-form novalidate>
          <div>
            <label class="auth-label" for="register-email">Email</label>
            <input
              class="auth-input"
              id="register-email"
              name="email"
              type="email"
              autocomplete="email"
              required
            />
          </div>

          <div>
            <label class="auth-label" for="register-password">Contrasena</label>
            <input
              class="auth-input"
              id="register-password"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
          </div>

          <button class="auth-submit" type="submit">Crear cuenta</button>
          <p class="auth-feedback" data-register-feedback aria-live="polite"></p>
        </form>

        <div class="auth-links">
          <a class="auth-link" href="/login.html">Ya tienes cuenta? Ingresar</a>
        </div>
      </section>
    </main>

    <script>
      window.addEventListener("load", function () {
        document.documentElement.classList.add("loaded");
      });
    </script>
    <script type="module" src="/src/js/register.js"></script>
  </body>
</html>
