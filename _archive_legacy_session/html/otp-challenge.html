<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html {
        visibility: hidden;
        background: #020202;
      }

      html.loaded {
        visibility: visible;
      }
    </style>
    <noscript><style>html { visibility: visible !important; }</style></noscript>
    <title>Solaris | OTP Challenge</title>
    <meta name="description" content="Verifica OTP para step-up MFA." />
    <link rel="icon" href="./Imagen/Iconos/logo_cua1.png" type="image/png" />
    <link rel="preload" href="/src/styles/theme.css" as="style" />
    <link rel="preload" href="/src/styles/auth.css" as="style" />
    <link rel="stylesheet" href="/src/styles/theme.css" />
    <link rel="stylesheet" href="/src/styles/auth.css" />
  </head>
  <body class="auth-page page-auth page-otp has-fixed-header">
    <header class="header">
      <div class="container header-inner">
        <a class="brand" href="/index.html" aria-label="Solaris Home">
          <img
            src="/assets/logo-solaris.svg"
            alt="Logo Solaris"
            class="brand-logo-img"
            onerror="this.onerror=null;this.src='./Imagen/Iconos/logo_cua1.png';"
          />
          <span>SOLARIS</span>
        </a>
      </div>
    </header>

    <main class="auth-shell">
      <section class="auth-card" aria-label="Challenge OTP">
        <div class="auth-brand">
          <img
            src="/assets/logo-solaris.svg"
            alt="Solaris"
            class="auth-brand__logo"
            onerror="this.onerror=null;this.src='./Imagen/Iconos/logo_blanco_1.png';"
          />
          <h1 class="auth-brand__title">Step-Up MFA</h1>
        </div>

        <form class="auth-form" data-auth-form="otp" novalidate>
          <p class="auth-label" data-otp-hint>Ingresa el codigo OTP enviado a tu canal seguro.</p>

          <div>
            <label class="auth-label" for="otp-code">Codigo OTP</label>
            <input
              class="auth-input"
              id="otp-code"
              name="otp_code"
              type="text"
              inputmode="numeric"
              pattern="[0-9]{6}"
              maxlength="6"
              minlength="6"
              required
            />
          </div>

          <button class="auth-submit" type="submit">Verificar OTP</button>
          <button class="auth-submit auth-submit--ghost" type="button" data-otp-resend>
            Reenviar OTP
          </button>
          <p class="auth-feedback" data-auth-feedback aria-live="polite"></p>
        </form>

        <div class="auth-links">
          <a class="auth-link" href="/login.html">Volver a login</a>
        </div>
      </section>
    </main>

    <script>
      window.addEventListener("load", function () {
        document.documentElement.classList.add("loaded");
      });
    </script>
    <script type="module" src="/src/js/auth.js"></script>
  </body>
</html>
