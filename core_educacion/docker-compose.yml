version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: educacion_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-educacion_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-educacion_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-educacion_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-educacion_user} -d ${POSTGRES_DB:-educacion_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: educacion_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: educacion_adminer
    restart: always
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      - postgres

  mailpit:
    image: axllent/mailpit:latest
    container_name: educacion_mailpit
    restart: always
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: educacion_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
