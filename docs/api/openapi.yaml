openapi: 3.0.3
info:
  title: Democra — API interna (server/)
  version: "1.0.0"
  description: >
    Documentación base de la API Express de Democra (server/index.js).
    Extraída de los routers reales (server/routes/*.js), no inventada.
    Todos los endpoints requieren un Bearer token de Supabase Auth salvo
    donde se indique explícitamente lo contrario (terminal-login, validate-ruc).
    Este archivo es el punto de partida ("estructura base") para mantener la
    documentación de la API sincronizada con el código — se debe actualizar
    cada vez que se agregue, cambie o elimine un endpoint en server/routes/.

servers:
  - url: http://localhost:8787/api
    description: Desarrollo local (server/index.js, puerto por defecto de config.js)

tags:
  - name: auth
    description: Autenticación, evaluación de riesgo, step-up OTP y login por terminal (PIN).
  - name: audit
    description: Auditoría forense (resumen asistido por IA) y métricas de seguridad del tenant.
  - name: iam
    description: >
      Gestión de roles, permisos y asignaciones usuario-rol-sede. Todas las
      escrituras (POST/PUT/DELETE) pasan también por
      requireFinancialWriteAccess() (server/middleware/financial-state.js) —
      pueden devolver 403 FIN-001 (tenant suspendido) o 403 FIN-002 (tenant
      en solo-lectura) antes de aplicar la regla de negocio propia de IAM.
  - name: onboarding
    description: Validación de datos fiscales y alta (bootstrap) de un tenant nuevo.
  - name: sedes
    description: >
      Gestión de sedes físicas del tenant. Igual que iam, las escrituras
      pasan por requireFinancialWriteAccess() (403 FIN-001/FIN-002).

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Supabase JWT
      description: >
        Access token de una sesión de Supabase Auth. El backend lo resuelve
        vía resolveAuthContext() (server/supabase.js) para obtener user + profile.

  schemas:
    ErrorResponse:
      type: object
      description: Formato estándar de error (server/utils/http.js sendError()).
      properties:
        error_code:
          type: string
          example: "IAM-004"
        error_type:
          type: string
          example: "auth"
        message:
          type: string

    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        hierarchy_level:
          type: integer

    Sede:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

  responses:
    Unauthorized:
      description: Token ausente, inválido o expirado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Body o parámetros inválidos.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TenantMismatch:
      description: El tenant solicitado no coincide con el del perfil autenticado (TEN-003).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    FinancialRestricted:
      description: >
        El tenant está suspendido (FIN-001) o en modo de solo-lectura (FIN-002)
        por su estado financiero — bloquea escrituras (server/middleware/financial-state.js,
        montado en todas las rutas de escritura de iam.js y sedes.js).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: >
        Error inesperado no capturado por la lógica de la ruta
        (server/utils/http.js sendUnexpectedError()) — aplica a cualquier endpoint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

security:
  - bearerAuth: []

paths:
  /auth/risk-evaluate:
    post:
      tags: [auth]
      summary: Evalúa el motor de riesgo para el usuario/tenant actual
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_id:
                  type: string
                  format: uuid
                tipo_evento:
                  type: string
                user_agent:
                  type: string
                geo_country:
                  type: string
                device_fingerprint:
                  type: string
                timestamp:
                  type: string
                  format: date-time
                action_name:
                  type: string
                action_criticality:
                  type: string
                required_permission:
                  type: string
                sede_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Decisión del motor de riesgo (ALLOW / REQUIRE_OTP / BLOCK).
          content:
            application/json:
              schema:
                type: object
                properties:
                  risk_level:
                    type: string
                  decision:
                    type: string
                    enum: [ALLOW, REQUIRE_OTP, BLOCK]
                  reason_codes:
                    type: array
                    items:
                      type: string
                  user_message:
                    type: string
                  error_code:
                    type: string
                  blocked_until:
                    type: string
                    format: date-time
                    nullable: true
                  challenge_id:
                    type: string
                    nullable: true
                  challenge_expires_at:
                    type: string
                    format: date-time
                    nullable: true
                  challenge_delivery_hint:
                    type: string
                    nullable: true
                  challenge_delivery_status:
                    type: string
                    nullable: true
                  debug_otp:
                    type: string
                    nullable: true
                    description: Solo presente si el modo debug de OTP está habilitado.
                  session_id:
                    type: string
                    nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/TenantMismatch"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/step-up/verify-otp:
    post:
      tags: [auth]
      summary: Verifica un código OTP de un desafío de step-up ya iniciado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, code]
              properties:
                tenant_id:
                  type: string
                  format: uuid
                challenge_id:
                  type: string
                code:
                  type: string
                  description: Código OTP de 6 dígitos.
      responses:
        "200":
          description: Sesión step-up creada tras verificar el OTP.
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            OTP incorrecto, expirado o desafío inválido — código de error
            explicado vía explainErrorCode(verified.reason) (server/routes/auth.js).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/step-up/resend-otp:
    post:
      tags: [auth]
      summary: Reenvía un código OTP para un desafío de step-up activo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id]
              properties:
                tenant_id:
                  type: string
                  format: uuid
                challenge_id:
                  type: string
      responses:
        "200":
          description: OTP reenviado.
        "400":
          description: Falta challenge_id (IAM-001).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Fallo al reenviar el OTP (proveedor de email no disponible/configurado).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/terminal-login:
    post:
      tags: [auth]
      summary: Login por PIN en un terminal físico (kiosco), sin sesión Supabase previa
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, user_id, pin, terminal_id]
              properties:
                tenant_id:
                  type: string
                  format: uuid
                user_id:
                  type: string
                  format: uuid
                pin:
                  type: string
                terminal_id:
                  type: string
                  format: uuid
                user_agent:
                  type: string
      responses:
        "200":
          description: Sesión de terminal creada.
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: PIN incorrecto, aún sin llegar al máximo de intentos (IAM-001).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >
            Terminal inactivo o no encontrado (IAM-005), perfil no encontrado
            (IAM-001), usuario bloqueado (IAM-002), o bloqueado por el motor
            de riesgo (error_code de explainErrorCode(riskResult.error_code),
            con risk_level/reason_codes/blocked_until adicionales en el body).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: >
            PIN bloqueado temporalmente (IAM-002) — ya estaba bloqueado, o se
            acaba de alcanzar el máximo de intentos permitidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /audit/summary:
    post:
      tags: [audit]
      summary: Genera un resumen forense asistido por IA de un evento de auditoría
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_id:
                  type: string
                  format: uuid
                event_type:
                  type: string
                resource_name:
                  type: string
                result:
                  type: string
                  enum: [success, error]
                criticality:
                  type: string
                  enum: [low, medium, high, critical]
                payload_before:
                  type: object
                  nullable: true
                payload_after:
                  type: object
                  nullable: true
                error_code:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Resumen generado (sin exponer datos sensibles).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  summary:
                    type: string
                  reasoning:
                    type: string
                  confidence:
                    type: number
                  audit_log_id:
                    type: string
                    format: uuid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/TenantMismatch"
        "500":
          $ref: "#/components/responses/InternalError"

  /audit/metrics:
    get:
      tags: [audit]
      summary: Métricas de seguridad del tenant de los últimos 7 días
      description: >
        Monta también bajo /api/security/metrics (mismo router, dos prefijos
        — ver server/index.js: app.use("/api/audit", auditRoutes) y
        app.use("/api/security", auditRoutes)).
      responses:
        "200":
          description: >
            Conteos agregados de auth_events, pagos y sesiones activas
            (login_success_rate, PIN_failure_rate, y otros conteos — ver
            server/routes/audit.js para el shape exacto).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/TenantMismatch"
        "500":
          $ref: "#/components/responses/InternalError"

  /iam/roles:
    get:
      tags: [iam]
      summary: Lista los roles del tenant actual
      description: >
        Todos los endpoints de /iam/* pasan por resolveIamContext() (server/routes/iam.js),
        que puede devolver 401 IAM-004 (sin perfil válido) o 409 TEN-003 (mismatch
        de tenant) antes de llegar a la lógica propia de cada ruta.
      responses:
        "200":
          description: Lista de roles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"
        "401":
          description: Sin perfil válido para resolver el contexto IAM (IAM-004).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/TenantMismatch"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [iam]
      summary: Crea un nuevo rol en el tenant actual
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                hierarchy_level:
                  type: integer
      responses:
        "201":
          description: Rol creado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Sin perfil válido para resolver el contexto IAM (IAM-004).
        "403":
          description: El actor no tiene permiso para gestionar roles (IAM-003).
        "409":
          $ref: "#/components/responses/TenantMismatch"
        "500":
          $ref: "#/components/responses/InternalError"

  /iam/roles/{roleId}:
    put:
      tags: [iam]
      summary: Actualiza un rol existente
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                hierarchy_level:
                  type: integer
      responses:
        "200":
          description: Rol actualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    $ref: "#/components/schemas/Role"
        "400":
          description: Falta o está vacío el campo name (IAM-001).
        "401":
          description: Sin perfil válido para resolver el contexto IAM (IAM-004).
        "403":
          description: El actor no tiene permiso para gestionar roles (IAM-003).
        "404":
          description: Rol no encontrado en este tenant (IAM-001).
        "409":
          $ref: "#/components/responses/TenantMismatch"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [iam]
      summary: Elimina un rol (no del sistema)
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Rol eliminado.
        "401":
          description: Sin perfil válido para resolver el contexto IAM (IAM-004).
        "403":
          description: El actor no tiene permiso para gestionar roles (IAM-003).
        "409":
          $ref: "#/components/responses/TenantMismatch"
        "500":
          $ref: "#/components/responses/InternalError"

  /iam/roles/{roleId}/permissions:
    get:
      tags: [iam]
      summary: Lista los permisos asignados a un rol
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Lista de permisos del rol.
        "401":
          description: Sin perfil válido para resolver el contexto IAM (IAM-004).
        "403":
          description: El actor no tiene permiso para gestionar roles (IAM-003).
        "409":
          $ref: "#/components/responses/TenantMismatch"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [iam]
      summary: Asigna un permiso a un rol
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission]
              properties:
                permission:
                  type: string
      responses:
        "201":
          description: Permiso asignado.
        "400":
          description: Falta el campo permission (IAM-001).
        "401":
          description: Sin perfil válido para resolver el contexto IAM (IAM-004).
        "403":
          description: El actor no tiene permiso para gestionar roles (IAM-003).
        "409":
          $ref: "#/components/responses/TenantMismatch"
        "500":
          $ref: "#/components/responses/InternalError"

  /iam/roles/{roleId}/permissions/{permission}:
    delete:
      tags: [iam]
      summary: Revoca un permiso de un rol
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: permission
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Permiso revocado.
        "401":
          description: Sin perfil válido para resolver el contexto IAM (IAM-004).
        "403":
          description: El actor no tiene permiso para gestionar roles (IAM-003).
        "409":
          $ref: "#/components/responses/TenantMismatch"
        "500":
          $ref: "#/components/responses/InternalError"

  /iam/user-roles:
    get:
      tags: [iam]
      summary: Lista asignaciones usuario-rol-sede del tenant
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filtra las asignaciones devueltas por usuario.
      responses:
        "200":
          description: Lista de asignaciones.
        "401":
          description: Sin perfil válido para resolver el contexto IAM (IAM-004).
        "403":
          description: El actor no tiene permiso para gestionar asignaciones (IAM-003).
        "409":
          $ref: "#/components/responses/TenantMismatch"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [iam]
      summary: Asigna un rol (en una sede) a un usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, role_id, sede_id]
              properties:
                user_id:
                  type: string
                  format: uuid
                role_id:
                  type: string
                  format: uuid
                sede_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Asignación creada.
        "400":
          description: Falta user_id, role_id o sede_id (IAM-001).
        "401":
          description: Sin perfil válido para resolver el contexto IAM (IAM-004).
        "403":
          description: El actor no tiene permiso para gestionar asignaciones (IAM-003).
        "409":
          $ref: "#/components/responses/TenantMismatch"
        "500":
          $ref: "#/components/responses/InternalError"

  /iam/user-roles/{assignmentId}:
    delete:
      tags: [iam]
      summary: Revoca una asignación usuario-rol-sede
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Asignación revocada.
        "401":
          description: Sin perfil válido para resolver el contexto IAM (IAM-004).
        "403":
          description: El actor no tiene permiso para gestionar asignaciones (IAM-003).
        "409":
          $ref: "#/components/responses/TenantMismatch"
        "500":
          $ref: "#/components/responses/InternalError"

  /onboarding/validate-ruc/{ruc}:
    get:
      tags: [onboarding]
      summary: Valida un RUC de 11 dígitos contra el servicio fiscal externo configurado
      security: []
      parameters:
        - name: ruc
          in: path
          required: true
          schema:
            type: string
            pattern: "^\\d{11}$"
      responses:
        "200":
          description: Datos fiscales del RUC.
        "400":
          description: RUC con formato inválido (TEN-001).
        "403":
          description: >
            Empresa inactiva o "no habida" según el servicio fiscal (TEN-002)
            — bloquea el onboarding aunque el RUC exista y tenga formato válido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: RUC no encontrado en el servicio fiscal (TEN-001).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Respuesta ambigua o inesperada del servicio fiscal externo (TEN-001).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Error o caída de conexión con el servicio fiscal externo (TEN-001).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Servicio de validación fiscal no configurado.
        "500":
          $ref: "#/components/responses/InternalError"

  /onboarding/bootstrap-tenant:
    post:
      tags: [onboarding]
      summary: Crea (o devuelve, si ya existe) el tenant del usuario autenticado
      description: >
        Envuelve public.fn_bootstrap_tenant: crea tenant + profile + sede
        "Principal" + rol Owner + asignación, de forma idempotente. Antes de
        este endpoint no había ningún camino (Express ni Supabase directo)
        para que una organización nueva se diera de alta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_name, tax_id, industry_type_id]
              properties:
                tenant_name:
                  type: string
                tax_id:
                  type: string
                  pattern: "^\\d{11}$"
                  description: RUC de 11 dígitos.
                industry_type_id:
                  type: string
                  example: ong
                plan_id:
                  type: string
                  default: basic
                billing_day:
                  type: integer
                  minimum: 1
                  maximum: 28
                  default: 1
      responses:
        "201":
          description: Tenant creado o ya existente para este usuario.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id:
                    type: string
                    format: uuid
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /sedes:
    get:
      tags: [sedes]
      summary: Lista las sedes del tenant actual
      responses:
        "200":
          description: Lista de sedes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sedes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Sede"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/TenantMismatch"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [sedes]
      summary: Crea una nueva sede (requiere ser administrador del tenant)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Sede creada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sede:
                    $ref: "#/components/schemas/Sede"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            El actor no es administrador del tenant (IAM-003), o el tenant
            está suspendido/en solo-lectura (FIN-001/FIN-002).
        "409":
          $ref: "#/components/responses/TenantMismatch"
        "500":
          $ref: "#/components/responses/InternalError"

  /sedes/{sedeId}:
    put:
      tags: [sedes]
      summary: Actualiza el nombre o estado de una sede (requiere ser administrador)
      parameters:
        - name: sedeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                is_active:
                  type: boolean
      responses:
        "200":
          description: Sede actualizada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sede:
                    $ref: "#/components/schemas/Sede"
        "400":
          description: name vacío, o no se proveyó ningún campo a actualizar (TEN-001).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            El actor no es administrador del tenant (IAM-003), o el tenant
            está suspendido/en solo-lectura (FIN-001/FIN-002).
        "404":
          description: Sede no encontrada en este tenant.
        "409":
          $ref: "#/components/responses/TenantMismatch"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [sedes]
      summary: Desactiva una sede (soft-delete — no elimina la fila; ver comentario en sedes.js)
      parameters:
        - name: sedeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Sede desactivada.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            El actor no es administrador del tenant (IAM-003), o el tenant
            está suspendido/en solo-lectura (FIN-001/FIN-002).
        "404":
          description: Sede no encontrada en este tenant.
        "409":
          $ref: "#/components/responses/TenantMismatch"
        "500":
          $ref: "#/components/responses/InternalError"
